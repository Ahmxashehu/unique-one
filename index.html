    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      // PWA shell recovery v2: clear only service-worker/app-shell caches once.
      // Firebase auth, localStorage, IndexedDB, and user data are untouched.
      (async () => {
        try {
          const refreshKey = 'unique-pwa-refresh-2026-10-05-v2';
          if (sessionStorage.getItem(refreshKey) !== '1' && 'serviceWorker' in navigator) {
            sessionStorage.setItem(refreshKey, '1');
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
            if ('caches' in window) {
              const cacheNames = await caches.keys();
              await Promise.all(cacheNames.map((cacheName) => caches.delete(cacheName)));
            }
            window.location.reload();
          }
        } catch {
          // Keep app startup resilient if browser PWA APIs are unavailable.
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
