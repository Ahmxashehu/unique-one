name: Deploy Firebase Rules

on:
  push:
    branches:
      - main
    paths:
      - firestore.rules
      - storage.rules
      - firebase.json
      - firestore.indexes.json
      - .firebaserc
      - .github/workflows/firebase-rules.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-firebase-rules:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_UNIQUE_ONE }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Firebase credential is configured
        shell: bash
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::GitHub Actions secret FIREBASE_SERVICE_ACCOUNT_UNIQUE_ONE is missing or unavailable to this workflow."
            exit 1
          fi
          echo "Firebase credential secret is available."

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firebase Firestore and Storage rules
        run: npx --yes firebase-tools@latest deploy --only firestore,storage --project unique-one-9731b
