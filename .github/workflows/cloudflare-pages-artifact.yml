name: Build Cloudflare Pages pilot artifact

on:
  workflow_dispatch:
  push:
    branches:
      - cloudflare-free-hosting-pilot
    paths-ignore:
      - 'cloudflare/**'
      - 'wrangler.jsonc'
      - '.github/workflows/cloudflare-pages-artifact.yml'

permissions:
  contents: read

jobs:
  build-pages-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pilot branch
        uses: actions/checkout@v4
        with:
          ref: cloudflare-free-hosting-pilot

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend for Pages
        run: npx vite build --outDir dist/cloudflare

      - name: Upload static website artifact
        uses: actions/upload-artifact@v4
        with:
          name: uniqueplatform-pages-site
          path: dist/cloudflare/
          if-no-files-found: error
          retention-days: 7
