name: Render Image Test Build

on:
  push:
    branches:
      - deploy/render-image-test
    paths:
      - 'Dockerfile.render-test'
      - '.github/workflows/render-image-test.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'server.ts'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig.json'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.render-test
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/ahmxashehu/unique-one-render-test:latest
            ghcr.io/ahmxashehu/unique-one-render-test:${{ github.sha }}
