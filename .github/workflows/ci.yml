name: Unique One CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run whole-platform smoke verification
        run: npm test

      - name: Verify PIN lockout against isolated Firestore Emulator
        run: npx --yes firebase-tools@14.22.0 emulators:exec --config firebase.emulator.json --only firestore --project demo-uniqueplatform-pin-lockout "npm run test:transaction-pin-emulator"

      - name: Audit user-facing localization coverage
        run: npm run localization:audit

      - name: Verify production PWA service worker
        run: |
          test -f dist/sw.js
          grep -q 'NavigationRoute' dist/sw.js
          grep -q 'index.html' dist/sw.js
          grep -q 'allowlist:' dist/sw.js
          grep -q 'denylist:' dist/sw.js

  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: android-native
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare Unique One APK
        working-directory: android-native
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          mkdir -p ../release-assets
          cp app/build/outputs/apk/debug/app-debug.apk ../release-assets/Unique-One.apk

      - name: Verify Unique One APK
        run: |
          test -f release-assets/Unique-One.apk
          file release-assets/Unique-One.apk

      - name: Upload Unique One APK
        uses: actions/upload-artifact@v7
        with:
          name: Unique-One-Android-APK
          path: release-assets/Unique-One.apk
          if-no-files-found: error
          retention-days: 14

