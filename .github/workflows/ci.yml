name: Unique One CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify production PWA service worker
        run: |
          test -f dist/sw.js
          grep -q 'NavigationRoute' dist/sw.js
          grep -q 'index.html' dist/sw.js
          grep -q 'allowlist:' dist/sw.js
          grep -q 'denylist:' dist/sw.js
